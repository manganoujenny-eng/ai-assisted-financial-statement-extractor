[tool.pytest.ini_options]
# `pythonpath` saves you from "ModuleNotFoundError: No module named 'app'",
# which is the single most common way a Python project wastes an afternoon.
pythonpath = ["backend", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
